name: Build & Release Windows
on:
  push:
    tags:
      - 'v*' # Trigger only when you push a tag like v1.0.1

permissions:
  contents: write # Important: Allows GitHub to upload files to your release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pubspec.yaml version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $pubspecVersion = ($line.Matches[0].Groups[1].Value -split '\+')[0]
          Write-Host "Tag version:     $tag"
          Write-Host "pubspec version: $pubspecVersion"
          if ($pubspecVersion -ne $tag) {
            Write-Error "pubspec.yaml version ($pubspecVersion) does not match tag ($tag). Bump pubspec.yaml before tagging."
            exit 1
          }

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: List Build Output
        shell: pwsh
        run: |
          Write-Host "Listing build output directory..."
          Get-ChildItem -Path build\windows -Recurse | Select-Object FullName

      - name: Package as ZIP
        shell: pwsh
        run: |
          # Grabs all files from the release folder and zips them
          $releasePath = "build\windows\x64\runner\Release"
          if (Test-Path $releasePath) {
            Compress-Archive -Path "$releasePath\*" -DestinationPath Samar_Trading_Invoice.zip
          } else {
            Write-Error "Release folder not found at $releasePath"
            exit 1
          }

      - name: Create Update JSON
        shell: pwsh
        run: |
          # This generates the file that auto_updater reads
          $VERSION = "${{ github.ref_name }}".Replace('v', '')
          $json = @{
              version = "$VERSION"
              notes = "Latest updates for Samar Trading Quotation App"
              pub_date = (Get-Date -Format "o")
              url = "https://github.com/samartiwari/samar-trading-quotation-app/releases/download/${{ github.ref_name }}/Samar_Trading_Invoice.zip"
          } | ConvertTo-Json
          $json | Out-File updates.json -Encoding utf8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Samar_Trading_Invoice.zip
            updates.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updates.json to main branch
        shell: pwsh
        run: |
          # Save the generated updates.json to temp location
          $tempFile = "$env:TEMP\updates.json"
          Copy-Item -Path updates.json -Destination $tempFile -Force
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          
          # Copy from temp to repo
          Copy-Item -Path $tempFile -Destination updates.json -Force
          
          git add updates.json
          git commit -m "chore: update updates.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}